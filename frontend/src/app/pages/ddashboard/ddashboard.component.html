<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="mb-0">

        Task Dashboard

    </h2>

    <button
        class="btn btn-outline-danger"
        (click)="logout()">

        Logout

    </button>

</div>


    <div class="row mb-4">

        <div class="col-md-3">

            <div class="card text-center">

                <div class="card-body">

                    <h6>Total Tasks</h6>

                    <h3>{{ totalTasks }}</h3>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card text-center">

                <div class="card-body">

                    <h6>Pending</h6>

                    <h3>{{ pendingTasks }}</h3>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card text-center">

                <div class="card-body">

                    <h6>Completed</h6>

                    <h3>{{ completedTasks }}</h3>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card text-center">

                <div class="card-body">

                    <h6>High Priority</h6>

                    <h3>{{ highPriorityTasks }}</h3>

                </div>

            </div>

        </div>

    </div>

    <div class="card mb-4">

        <div class="card-body">

            <h4 class="mb-3">
                Add New Task
            </h4>

            <form
                [formGroup]="taskForm"
                (ngSubmit)="createTask()">

                <div class="mb-3">

                    <input
                        class="form-control"
                        placeholder="Task Title"
                        formControlName="title">

                </div>

                <div class="mb-3">

                    <textarea
                        rows="3"
                        class="form-control"
                        placeholder="Task Description"
                        formControlName="description">
                    </textarea>

                </div>

                <div class="row">

                    <div class="col-md-6">

                        <select
                            class="form-select"
                            formControlName="status">

                            <option value="Pending">
                                Pending
                            </option>

                            <option value="Completed">
                                Completed
                            </option>

                        </select>

                    </div>

                    <div class="col-md-6">

                        <select
                            class="form-select"
                            formControlName="priority">

                            <option value="Low">
                                Low
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="High">
                                High
                            </option>

                        </select>

                    </div>

                </div>

                <button
                    class="btn btn-success mt-3"
                    type="submit">

                    {{ editingTaskId ? 'Update Task' : 'Add Task' }}

                </button>
                <button
                    type="button"
                    class="btn btn-secondary ms-2"
                    *ngIf="editingTaskId"
                    (click)="cancelEdit()">

                    Cancel
                </button>
                

            </form>

        </div>

    </div>

    <input
        class="form-control mb-4"
        placeholder="Search Tasks..."
        [(ngModel)]="searchText"
        (input)="searchTasks()">


    <div
        class="card mb-3"
        *ngFor="let task of filteredTasks">

        <div class="card-body">

    <div class="d-flex justify-content-between align-items-start">

        <div>

            <h5>{{ task.title }}</h5>

            <p class="mb-2">
                {{ task.description }}
            </p>

        </div>

        <div>

            <button
                class="btn btn-sm btn-warning me-2"
                (click)="editTask(task)">

                Edit

            </button>

            <button
                class="btn btn-sm btn-danger"
                (click)="deleteTask(task._id)">

                Delete

            </button>

        </div>

    </div>

    <div class="mt-2">

        <span class="badge bg-primary">
            {{ task.status }}
        </span>

        <span class="badge bg-danger ms-2">
            {{ task.priority }}
        </span>

    </div>

</div>

    </div>


    <div
        class="text-center mt-5"
        *ngIf="filteredTasks.length === 0">

        <h4>
            No Tasks Found
        </h4>

    </div>

</div>
